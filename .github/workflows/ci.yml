name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -U pip pytest build
      - name: Unit tests
        run: pytest -q
      - name: Build wheel
        run: python -m build --wheel
      - name: Reject bytecode in wheel
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          wheel = next(Path('dist').glob('*.whl'))
          with zipfile.ZipFile(wheel) as zf:
              bad = [n for n in zf.namelist() if '__pycache__' in n or n.endswith('.pyc')]
              assert not bad, bad
          PY
