name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -U pip pytest build
      - name: Unit tests
        run: pytest -q
      - name: Build wheel
        run: python -m build --wheel
      - name: Reject bytecode in wheel
        run: >-
          python -c "from pathlib import Path; import zipfile; wheel=next(Path('dist').glob('*.whl')); zf=zipfile.ZipFile(wheel); bad=[n for n in zf.namelist() if '__pycache__' in n or n.endswith('.pyc')]; assert not bad, bad"
