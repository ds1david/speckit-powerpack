schema_version: "1.0"

preset:
  id: "powerpack-core"
  name: "SpecKit PowerPack Core"
  version: "0.1.0"
  description: "Composable workflow policy, prerequisites, convergence gates, model routing, and implementation review for official Spec Kit."
  author: "David Oliveira"
  repository: "https://github.com/ds1david/speckit-powerpack"
  license: "MIT"

requires:
  speckit_version: ">=1.0.0"
  extensions:
    - id: "powerpack-tools"
      version: ">=0.1.0"
      required: true

provides:
  templates:
    - type: "command"
      name: "speckit.specify"
      file: "commands/speckit.specify.md"
      description: "Wrap official specify with PowerPack routing and state."
      strategy: "wrap"
    - type: "command"
      name: "speckit.clarify"
      file: "commands/speckit.clarify.md"
      description: "Wrap official clarify with PowerPack routing and state."
      strategy: "wrap"
    - type: "command"
      name: "speckit.plan"
      file: "commands/speckit.plan.md"
      description: "Wrap official plan with PowerPack routing and state."
      strategy: "wrap"
    - type: "command"
      name: "speckit.checklist"
      file: "commands/speckit.checklist.md"
      description: "Wrap official checklist and record prerequisite evidence."
      strategy: "wrap"
    - type: "command"
      name: "speckit.checklist-converge"
      file: "commands/speckit.checklist-converge.md"
      description: "Converge requirements-quality checklists after speckit.checklist."
      strategy: "replace"
    - type: "command"
      name: "speckit.tasks"
      file: "commands/speckit.tasks.md"
      description: "Wrap official tasks with prerequisite enforcement."
      strategy: "wrap"
    - type: "command"
      name: "speckit.analyze"
      file: "commands/speckit.analyze.md"
      description: "Wrap official analyze with prerequisite enforcement."
      strategy: "wrap"
    - type: "command"
      name: "speckit.implement"
      file: "commands/speckit.implement.md"
      description: "Wrap official implement and record implementation eligibility."
      strategy: "wrap"
    - type: "command"
      name: "speckit.converge"
      file: "commands/speckit.converge.md"
      description: "Wrap official convergence and record its result."
      strategy: "wrap"
    - type: "command"
      name: "speckit.implement-review"
      file: "commands/speckit.implement-review.md"
      description: "Independent implementation-quality review after implement/converge."
      strategy: "replace"

tags:
  - "sdd"
  - "workflow"
  - "quality"
  - "review"
