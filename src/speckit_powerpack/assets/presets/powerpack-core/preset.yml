schema_version: "1.0"

preset:
  id: "powerpack-core"
  name: "SpecKit PowerPack Core"
  version: "0.1.0"
  description: "Composable prerequisite gates, convergence, deep implementation review, full-cycle orchestration and governed technical-debt lifecycle for official Spec Kit."
  author: "David Oliveira"
  repository: "https://github.com/ds1david/speckit-powerpack"
  license: "MIT"

requires:
  speckit_version: ">=1.0.0"
  extensions:
    - id: "powerpack-tools"
      version: ">=0.1.0"
      required: true

provides:
  templates:
    - type: "command"
      name: "speckit.implement"
      file: "commands/speckit.implement.md"
      description: "Wrap official implement and record a precise same-SPEC implementation delta."
      strategy: "wrap"
    - type: "command"
      name: "speckit.converge"
      file: "commands/speckit.converge.md"
      description: "Wrap official converge and record convergence state."
      strategy: "wrap"
    - type: "command"
      name: "speckit.checklist-converge"
      file: "commands/speckit.checklist-converge.md"
      description: "Converge requirements-writing checklists after speckit.checklist."
      strategy: "replace"
    - type: "command"
      name: "speckit.implement-review"
      file: "commands/speckit.implement-review.md"
      description: "Executor-aware, capability-driven deep implementation review with evidence validation and findings-to-tasks convergence."
      strategy: "replace"
    - type: "command"
      name: "speckit.full-cycle"
      file: "commands/speckit.full-cycle.md"
      description: "Orchestrate one same-SPEC cycle through specification, implementation, convergence and independent review."
      strategy: "replace"
    - type: "command"
      name: "speckit.debt-create"
      file: "commands/speckit.debt-create.md"
      description: "Create a technical-debt item only after the PowerPack deferral-policy gate passes."
      strategy: "replace"
    - type: "command"
      name: "speckit.debt-list"
      file: "commands/speckit.debt-list.md"
      description: "List and group technical debt without modifying the backlog."
      strategy: "replace"
    - type: "command"
      name: "speckit.debt-consult"
      file: "commands/speckit.debt-consult.md"
      description: "Inspect exact debt provenance, evidence, dependencies and readiness."
      strategy: "replace"
    - type: "command"
      name: "speckit.debt-start"
      file: "commands/speckit.debt-start.md"
      description: "Start coherent debt work after a readiness gate without automatically creating a SPEC."
      strategy: "replace"
    - type: "command"
      name: "speckit.debt-close"
      file: "commands/speckit.debt-close.md"
      description: "Resolve technical debt only with objective evidence against original resolution criteria."
      strategy: "replace"

tags: ["sdd", "workflow", "quality", "review", "technical-debt", "portable"]
